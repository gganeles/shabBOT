[package]
name = "rustWABot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
chrono-tz = "0.10.4"
csv = "1.3"
diesel = { version = "2.2", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
diesel_migrations = "2.2"
env_logger = "0.11.8"
log = "0.4.28"
qr2term = "0.3.3"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.48.0"
ureq = { version = "2.10", features = ["json"] }
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4"] }
wacore = "0.1.0"
waproto = "0.1.0"
whatsapp-rust = "0.1"

[lib]
name = "rustWABot"
path = "lib.rs"

[[bin]]
name = "rustWABot"
path = "main.rs"
