name: Deploy Application on Push

on:
  push:
    branches:
      - goShabBOT # Trigger this workflow only when pushes are made to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy and Restart Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GH_TOKEN
          script: |
            set -euo pipefail
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH

            REPO="gganeles/shabBOT"
            BRANCH="goShabBOT"
            APP_DIR="$HOME/shabBOT"
            GIT_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone -b "$BRANCH" "$GIT_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch "$GIT_URL" "$BRANCH"
              git reset --hard FETCH_HEAD
            fi

            go build
            sudo systemctl restart shabbot.service
            echo "Deployment and restart complete."
